name: Update README on Commit

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - refs-updated

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Spec repo (source of refs)
        uses: actions/checkout@v4
        with:
          repository: Memo-Init/spec
          path: _spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fetch refs from Spec
        run: npm run fetch-refs
        env:
          SPEC_REPO_DIR: ${{ github.workspace }}/_spec

      - name: Run Node.js Script
        run: node index.mjs

      - name: Commit and Push Changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "Update README" || echo "No changes to commit"
          git push
